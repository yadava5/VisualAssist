name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This job used to be called "Build & Test" while running no tests at
    # all — VisualAssistTests held 71 test functions and this file had no
    # `xcodebuild test` step, so the word "Test" appeared in the check
    # GitHub shows on every pull request and meant nothing. It was renamed
    # to "Build", honestly, and the test step was withheld on the grounds
    # that a step nobody has watched pass turns weak CI into red CI.
    #
    # It has now been watched pass. 2026-08-02, locally, iPhone 17 Pro on
    # iOS 26.5: 71 passed, 0 failed, 0 skipped. So the step goes in, and
    # the name goes back to what it can now support.
    name: Build & Test
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        # List available Xcode versions and select the latest
        ls /Applications | grep Xcode
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Show Available Simulators
      # `|| true` because this is informational and grep exits 1 when it matches
      # nothing — which is exactly what happens once the runner image rolls past
      # the hard-coded model names, failing the job over a diagnostic printout.
      run: xcrun simctl list devices available | grep -E "iPhone" || true

    - name: Build for iOS Simulator
      run: |
        # Find an available iPhone simulator
        DESTINATION=$(xcrun simctl list devices available | grep "iPhone 15 Pro" | head -1 | sed 's/.*(\(.*\)).*/\1/' | head -1)
        if [ -z "$DESTINATION" ]; then
          DESTINATION="platform=iOS Simulator,name=iPhone 15 Pro"
        else
          DESTINATION="platform=iOS Simulator,id=$DESTINATION"
        fi
        echo "Using destination: $DESTINATION"
        
        xcodebuild build \
          -project VisualAssist.xcodeproj \
          -scheme VisualAssist \
          -destination "$DESTINATION" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_STRICT_CONCURRENCY=minimal \
          | xcpretty && exit ${PIPESTATUS[0]}

    - name: Build for Release
      run: |
        xcodebuild build \
          -project VisualAssist.xcodeproj \
          -scheme VisualAssist \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_STRICT_CONCURRENCY=minimal \
          | xcpretty && exit ${PIPESTATUS[0]}

    - name: Resolve a simulator
      id: sim
      # Resolve by UDID from whatever the runner actually has, rather than
      # naming a model. Hard-coding "iPhone 15 Pro" ties this workflow to one
      # runner image; the images roll forward and the resulting failure reads
      # like a broken test rather than a missing device.
      run: |
        UDID=$(./scripts/resolve-simulator.sh)
        echo "Using simulator $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Run tests
      run: |
        xcodebuild test \
          -project VisualAssist.xcodeproj \
          -scheme VisualAssist \
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
          -resultBundlePath TestResults.xcresult \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_STRICT_CONCURRENCY=minimal \
          | xcpretty && exit ${PIPESTATUS[0]}

    - name: Assert the tests actually ran
      # The logic lives in scripts/assert-test-results.sh so it can be run and
      # negative-tested on a laptop. A CI gate nobody has watched fail is a gate
      # nobody knows works.
      run: ./scripts/assert-test-results.sh TestResults.xcresult 60

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xcresult
        path: TestResults.xcresult
        retention-days: 14

  code-analysis:
    name: Code Analysis
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging
      continue-on-error: true
      
    - name: Check for TODO/FIXME
      run: |
        echo "## TODOs and FIXMEs found in code:" 
        grep -rn "TODO\|FIXME" --include="*.swift" VisualAssist/ || echo "None found ✓"
      continue-on-error: true

  # This job used to be called "Accessibility Compliance" and could not fail.
  # It was `continue-on-error: true` running nothing but echo and grep, so it
  # printed warnings and reported success no matter what the tree contained —
  # on a product whose entire purpose is accessibility. A green tick that means
  # nothing is worse than no job, because it is read as evidence.
  #
  # It is now a RATCHET, and it is named for what it measures rather than for
  # what would be flattering. It does not claim compliance — nothing here
  # audits against WCAG or Apple's guidance, and the README is explicit that
  # VoiceOver support, Dynamic Type and High Contrast are NOT in this build.
  # What it does is refuse to let the current state get worse: the counts below
  # are the measured baseline, and CI goes red if coverage slips beneath them.
  accessibility-ratchet:
    name: Accessibility Ratchet
    # Pure text analysis — no Xcode, so this does not need a macOS runner.
    runs-on: ubuntu-latest

    env:
      # Measured 2026-08-10. Raise these as coverage improves; never lower them
      # without saying why in the commit message.
      MIN_MODIFIERS: 53
      MAX_VIEWS_WITHOUT_LABEL: 1

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Accessibility coverage may not regress
      run: |
        set -euo pipefail
        fail=0

        # 1. Total .accessibility* modifiers under Views/ must not drop.
        #    `|| true` because grep exits 1 on no matches, and under `pipefail`
        #    that would abort the script with an opaque error at exactly the
        #    moment the count hit zero — the worst possible time to lose the
        #    message explaining why.
        MODIFIERS=$( { grep -rho '\.accessibility[A-Za-z]*' --include='*.swift' VisualAssist/Views/ || true; } | wc -l | tr -d ' ')
        echo "accessibility modifiers under Views/: $MODIFIERS (floor $MIN_MODIFIERS)"
        if [ "$MODIFIERS" -lt "$MIN_MODIFIERS" ]; then
          echo "::error::Accessibility modifiers fell to $MODIFIERS, below the floor of $MIN_MODIFIERS."
          fail=1
        fi

        # 2. The set of *View.swift files with no accessibilityLabel may not grow.
        #    ContentView.swift is the one currently in it: it is the root router
        #    and holds no interactive controls of its own, which is why the
        #    ceiling is 1 rather than 0. A SECOND unlabelled view is a real
        #    regression and fails this job.
        missing=0
        echo ""
        echo "views without an accessibilityLabel:"
        while IFS= read -r file; do
          if ! grep -q "accessibilityLabel" "$file"; then
            echo "  MISSING  $file"
            missing=$((missing + 1))
          else
            echo "  ok       $file"
          fi
        done < <(find VisualAssist -name "*View.swift" | sort)

        echo ""
        echo "views missing a label: $missing (ceiling $MAX_VIEWS_WITHOUT_LABEL)"
        if [ "$missing" -gt "$MAX_VIEWS_WITHOUT_LABEL" ]; then
          echo "::error::$missing view files lack an accessibilityLabel, above the ceiling of $MAX_VIEWS_WITHOUT_LABEL."
          fail=1
        fi

        exit $fail

  documentation:
    name: Documentation Check
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Check Documentation
      run: |
        echo "## Checking documentation coverage..."
        
        # Check for doc comments
        DOCUMENTED=$(grep -rl "/// " --include="*.swift" VisualAssist/ | wc -l | tr -d ' ')
        TOTAL=$(find VisualAssist -name "*.swift" | wc -l | tr -d ' ')
        
        echo "Files with documentation comments: $DOCUMENTED / $TOTAL"
        
        # Check for README
        if [ -f "README.md" ]; then
          echo "✓ README.md exists"
          WORDS=$(wc -w < README.md | tr -d ' ')
          echo "  Word count: $WORDS"
        else
          echo "✗ README.md missing"
          exit 1
        fi
        
        # Check for other docs
        for doc in CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md; do
          if [ -f "$doc" ]; then
            echo "✓ $doc exists"
          else
            echo "⚠️  $doc missing"
          fi
        done

