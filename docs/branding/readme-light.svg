<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200"
     role="img" aria-label="Visual Assist. Help visually impaired users navigate their environment safely and independently.">
  <title>Visual Assist</title>
  <defs>
    <clipPath id="panel"><rect x="1.5" y="1.5" width="757" height="197" rx="16"/></clipPath>
  </defs>
  <style>
    .name { font: 650 40px ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI",
            "Helvetica Neue", Arial, sans-serif; fill: #1c1626; letter-spacing: -0.5px; }
    .desc { font: 400 15px ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI",
            "Helvetica Neue", Arial, sans-serif; fill: #4e4660; }
  </style>

  <!-- Light panel; sonar rings and sweep from the app icon, in ink so nothing depends on color alone. -->
  <rect x="1.5" y="1.5" width="757" height="197" rx="16" fill="#f7f5fa"
        stroke="#e2ddec" stroke-width="1.5"/>
  <g clip-path="url(#panel)">
    <g fill="none" stroke="#1c1626">
      <circle cx="128" cy="100" r="26" stroke-opacity="0.14" stroke-width="1.4"/>
      <circle cx="128" cy="100" r="52" stroke-opacity="0.11" stroke-width="1.3"/>
      <circle cx="128" cy="100" r="78" stroke-opacity="0.09" stroke-width="1.2"/>
      <circle cx="128" cy="100" r="104" stroke-opacity="0.07" stroke-width="1.1"/>
      <circle cx="128" cy="100" r="130" stroke-opacity="0.05" stroke-width="1"/>
    </g>
    <!-- LiDAR sweep arc + return dot -->
    <path d="M114.5,23.2 A78,78 0 0 1 201.3,73.3" fill="none" stroke="#5f45a3"
          stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170.6" cy="70.2" r="6.5" fill="#5f45a3"/>
  </g>

  <text x="272" y="98" class="name">Visual Assist</text>
  <text x="272" y="132" class="desc">Help visually impaired users navigate their</text>
  <text x="272" y="154" class="desc">environment safely and independently</text>
</svg>
